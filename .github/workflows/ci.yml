name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

# A newer push to a pull request replaces the run for the older one, and so does
# converting it to draft (that run stops at its first step). Pushes to main are
# grouped by commit, so a main run is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Draft pull requests are still under review. Their run fails at once
      # rather than being skipped: a skipped required check counts as passing,
      # and run order within a concurrency group is not guaranteed, so a late
      # draft run could otherwise replace a ready run and leave it looking green.
      - name: Stop on a draft pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        shell: bash
        run: |
          echo "Draft pull request: not verified. Mark it ready to run CI."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # release:invariants runs scripts/tick-citations.mjs, which proves a
          # cited sha is an ancestor of this branch. A shallow clone cannot
          # answer that, and the checker fails rather than passing when it
          # cannot tell, so removing this breaks the build instead of turning
          # the citation check green without checking anything.
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Require this pull request's release metadata
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        timeout-minutes: 2
        run: pnpm release:metadata
      - run: pnpm lint
      - run: pnpm typecheck
      # The native systemd test gates on the user manager's private socket, so
      # without one the Linux leg would skip it and prove nothing. Lingering
      # starts systemd --user for this account; the socket check below fails the
      # job rather than letting the test disappear from the run.
      - name: Start a systemd user manager
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            if [ -S "$runtime/systemd/private" ]; then break; fi
            sleep 1
          done
          test -S "$runtime/systemd/private"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" systemctl --user show --property=Version
      # Same rule on the macOS leg: the native launchd test gates on the per-user
      # gui domain the installer targets, so without one it would skip and prove
      # nothing. Hosted macOS images auto-login the runner user, which is what
      # creates that domain; this check fails the job rather than letting the
      # test disappear from the run. Never run it under sudo, which would ask
      # for gui/0 instead of the runner's own domain.
      - name: Require a per-user launchd domain
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          uid="$(id -u)"
          test "$uid" -ne 0
          launchctl print "gui/$uid" > "$RUNNER_TEMP/launchd-domain.txt"
          echo "gui/$uid answers with $(wc -l < "$RUNNER_TEMP/launchd-domain.txt") lines"
      - run: pnpm test
      # A wire change since the last protocol release needs a minor above it.
      # The release record is committed once, at release. --base refuses a
      # pull request that changes or removes a record the base branch has, so
      # no pull request rewrites the record it is measured against.
      - name: Require a protocol minor bump for every wire change since the last release
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          WIRE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/protocol-wire.mjs check --base "$WIRE_BASE_SHA"
      - run: pnpm build
      - run: pnpm performance:budget
      - run: pnpm release:invariants
      - run: pnpm license:audit
      - run: pnpm test:install
      - run: pnpm release:artifacts
        if: matrix.os == 'ubuntu-latest'
      - name: Verify packed daemon on musl
        run: pnpm test:musl
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
      # The packaged app installs, starts and removes its own login service
      # (docs/desktop-launch-smoke.md). These steps stay inside verify so the
      # required checks keep covering them (docs/working-rules.md, D6). They
      # run last because the smoke changes the runner account's service
      # manager, and on macOS takes the installer's lease under that account's
      # own ~/.domovoi.
      - name: Package the desktop app unpacked
        if: matrix.os != 'windows-latest'
        run: pnpm --filter @getdomovoi/desktop package:dir
        timeout-minutes: 15
      - name: Packaged service smoke on macOS
        if: matrix.os == 'macos-latest'
        env:
          DOMOVOI_SERVICE_SMOKE_DISPOSABLE_HOST: '1'
        run: pnpm --filter @getdomovoi/desktop test:package:service
        timeout-minutes: 10
      # The systemd user manager reads units only under the home it started
      # with, so a temporary HOME cannot be installed into. The smoke runs as a
      # throwaway account with its own lingering manager, from a copy of the
      # unpacked app it owns, under the Node the app ships.
      - name: Packaged service smoke on Linux, as a throwaway account
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          account=domovoi-smoke
          sudo useradd --create-home --shell /usr/sbin/nologin "$account"
          home="$(getent passwd "$account" | cut -d: -f6)"
          uid="$(id -u "$account")"
          sudo loginctl enable-linger "$account"
          runtime="/run/user/$uid"
          for _ in $(seq 1 30); do
            if sudo test -S "$runtime/systemd/private"; then break; fi
            sleep 1
          done
          sudo test -S "$runtime/systemd/private"
          smoke="$home/smoke"
          sudo install -d -m 0700 "$smoke"
          sudo cp -a apps/desktop/dist/linux-unpacked "$smoke/linux-unpacked"
          sudo cp apps/desktop/scripts/package-service-smoke.mjs apps/desktop/scripts/desktop-smoke.mjs "$smoke/"
          sudo chown -R "$account:$account" "$smoke"
          sudo -u "$account" env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$home" USER="$account" LOGNAME="$account" \
            XDG_RUNTIME_DIR="$runtime" CI=true DOMOVOI_SERVICE_SMOKE_DISPOSABLE_HOST=1 \
            "$smoke/linux-unpacked/resources/daemon-runtime/node/bin/node" "$smoke/package-service-smoke.mjs" --dist "$smoke"
      - name: Packaged service smoke on Windows (skips with its reason)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @getdomovoi/desktop test:package:service
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Stop on a draft pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "Draft pull request: not verified. Mark it ready to run CI."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      # Every dependency type: electron is a devDependency of apps/desktop, yet
      # it is the runtime every desktop build ships.
      - run: pnpm audit --audit-level=high
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
