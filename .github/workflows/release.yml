name: release

# Versions and publishes @getdomovoi/protocol and @getdomovoi/daemon with Changesets and
# npm trusted publishing. Nothing runs until a maintainer sets the repository variable
# RELEASE_PUBLISHING to "enabled". The human steps are in docs/distribution.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'getdomovoi/domovoi'
      && github.ref == 'refs/heads/main'
      && vars.RELEASE_PUBLISHING == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm performance:budget
      - run: pnpm release:invariants
      - run: pnpm license:audit
      - run: pnpm test:install
      - id: mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    needs: verify
    if: needs.verify.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  pack:
    needs: verify
    if: needs.verify.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:artifacts
      - run: pnpm changeset publish-plan --output release/publish-plan.json
      - run: pnpm release:order release/publish-plan.json
      - run: pnpm changeset pack --from-publish-plan release/publish-plan.json --out-dir release/pack
      - name: Confirm the tarballs to publish match SHA256SUMS
        working-directory: release/pack/packages
        run: |
          for tarball in *.tgz; do
            grep --fixed-strings "  $tarball" ../../SHA256SUMS | sha256sum --check --strict
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - id: publish
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: pnpm changeset publish --from-pack-dir release/pack
      - name: Attach the tarballs, SBOMs, and SHA256SUMS to the GitHub releases
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          jq --raw-output '.[] | "\(.name)@\(.version) \(.name | ltrimstr("@") | sub("/"; "-"))-\(.version)"' <<< "$PUBLISHED_PACKAGES" |
            while read -r tag stem; do
              gh release upload "$tag" "release/$stem.tgz" "release/$stem.sbom.json" release/SHA256SUMS --clobber
            done
