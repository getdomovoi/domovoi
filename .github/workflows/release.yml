name: release

# Versions and publishes @getdomovoi/protocol and @getdomovoi/daemon with Changesets and
# npm trusted publishing. Nothing runs until a maintainer sets the repository variable
# RELEASE_PUBLISHING to "enabled". The human steps are in docs/distribution.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The gate is the ci workflow's own verdict on this exact commit, not a second
  # opinion about it. Re-running a subset here would publish on a weaker result
  # than main is held to: ci runs on Linux, macOS, and Windows, checks the packed
  # daemon on musl, and audits the production dependency graph, and this job
  # refuses to continue unless every one of those jobs concluded success.
  gate:
    if: >-
      github.repository == 'getdomovoi/domovoi'
      && github.ref == 'refs/heads/main'
      && vars.RELEASE_PUBLISHING == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require the ci workflow to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 50
        run: pnpm release:gate
      - id: mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    needs: gate
    if: needs.gate.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: pnpm release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  pack:
    needs: gate
    if: needs.gate.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:artifacts
      - run: pnpm changeset publish-plan --output release/publish-plan.json
      - run: pnpm release:prepare
      - run: pnpm release:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - run: pnpm release:verify
      - id: publish
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        env:
          npm_config_provenance: "true"
        with:
          script: pnpm changeset publish --from-pack-dir release/pack
          create-github-releases: false
      - name: Publish the canonical bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 12
        run: pnpm release:github
