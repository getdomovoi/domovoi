name: release

# Versions and publishes the npm packages listed in scripts/release-packages.mjs
# (@getdomovoi/protocol, @getdomovoi/credential-store, @getdomovoi/daemon and
# @getdomovoi/cli) with Changesets and npm trusted publishing.
# RELEASE_PUBLISHING="version-only" permits version PRs; "enabled" also permits
# publishing. An absent variable permits neither.
# The one-time manual bootstrap and human steps are in docs/release-setup.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      first_publish:
        description: One-time first alpha using the protected environment's temporary npm token
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The gate is the ci workflow's own verdict on this exact commit, not a second
  # opinion about it. Re-running a subset here would publish on a weaker result
  # than main is held to: ci runs on Linux, macOS, and Windows, checks the packed
  # daemon on musl, and audits the production dependency graph, and this job
  # refuses to continue unless every one of those jobs concluded success.
  gate:
    if: >-
      github.repository == 'getdomovoi/domovoi'
      && github.ref == 'refs/heads/main'
      && (vars.RELEASE_PUBLISHING == 'version-only' || vars.RELEASE_PUBLISHING == 'enabled')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require the ci workflow to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 50
        run: pnpm release:gate
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: gate
    if: needs.gate.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  pack-build:
    needs: gate
    if: needs.gate.outputs.mode == 'publish' && vars.RELEASE_PUBLISHING == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.3"
      - name: Build independently from a clean checkout and fresh caches
        env:
          BUILD_SLOT: ${{ matrix.slot }}
          BUILD_RUN: ${{ github.run_id }}.${{ github.run_attempt }}
        run: node scripts/release-reproducibility.mjs build "$BUILD_SLOT" "$BUILD_RUN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ matrix.slot }}
          path: release
          if-no-files-found: error
          retention-days: 7

  pack:
    needs: [gate, pack-build]
    if: needs.gate.outputs.mode == 'publish' && vars.RELEASE_PUBLISHING == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-a
          path: candidates/a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-b
          path: candidates/b
      - run: node scripts/release-reproducibility.mjs compare candidates/a candidates/b
      - run: pnpm changeset publish-plan --output release/publish-plan.json
      - run: pnpm release:prepare
      - run: pnpm release:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: pnpm release:verify
      - name: Refuse known registry or GitHub conflicts before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 2
        run: pnpm release:preflight
      - name: Admit trusted publishing or the one-time first alpha
        env:
          RELEASE_PUBLISHING: ${{ vars.RELEASE_PUBLISHING }}
          FIRST_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.first_publish && 'true' || 'false' }}
          NPM_BOOTSTRAP_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.first_publish && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        timeout-minutes: 2
        run: pnpm release:admit
      - name: Configure token auth only for the admitted first publication
        if: github.event_name == 'workflow_dispatch' && inputs.first_publish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          npm_config_provenance: "true"
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.first_publish && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        with:
          script: pnpm changeset publish --from-pack-dir release/pack
          create-github-releases: false
      - name: Publish the canonical bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 12
        run: pnpm release:github
