name: measure-windows

# Temporary: per-test and per-spawn timings on windows-latest for the
# timeouts under investigation. Removed before this pull request is ready.
on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @getdomovoi/protocol build && pnpm --filter @getdomovoi/credential-store build
      - name: Bench on an idle runner
        run: node apps/daemon/measure/bench.mjs idle 5
      - name: Target files alone, coverage on as in CI
        working-directory: apps/daemon
        run: npx vitest run --config measure/vitest.measure.config.ts --reporter=verbose src/fleet-production.test.ts src/workspace-recovery.test.ts src/workspace.test.ts > ../../alone.log 2>&1 || true
      - name: Whole daemon suite with a concurrent bench, coverage on as in CI
        working-directory: apps/daemon
        run: |
          (sleep 90; node measure/bench.mjs loaded 3 > ../../bench-loaded.log 2>&1) &
          npx vitest run --config measure/vitest.measure.config.ts --reporter=verbose > ../../suite.log 2>&1 || true
          wait
      - name: Summaries
        run: node apps/daemon/measure/summarize.mjs bench-loaded.log alone.log suite.log
