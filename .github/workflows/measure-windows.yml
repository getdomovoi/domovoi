name: measure-windows

# Temporary: timings on windows-latest for the timeouts under investigation.
# Removed before this pull request is ready.
on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @getdomovoi/protocol build && pnpm --filter @getdomovoi/daemon build
      - name: A, recovery file alone, six times
        working-directory: apps/daemon
        run: |
          for round in 1 2 3 4 5 6; do
            echo "ROUND A$round"
            npx vitest run --config measure/vitest.measure.config.ts --reporter=verbose src/workspace-recovery.test.ts 2>&1 | tee -a ../../a.log || true
          done
      - name: B, recovery and fleet files together, six times
        working-directory: apps/daemon
        run: |
          for round in 1 2 3 4 5 6; do
            echo "ROUND B$round"
            npx vitest run --config measure/vitest.measure.config.ts --reporter=verbose src/workspace-recovery.test.ts src/fleet-production.test.ts 2>&1 | tee -a ../../b.log || true
          done
      - name: C, fleet file three times with process-table samples every two seconds
        working-directory: apps/daemon
        run: |
          stop="$RUNNER_TEMP/stop-bench-c"
          BENCH_INTERVAL_MS=2000 node measure/bench.mjs fleet 0 loop "$stop" > ../../c-bench.log 2>&1 &
          for round in 1 2 3; do
            echo "ROUND C$round $(date -u +%H:%M:%S.%3N)"
            npx vitest run --config measure/vitest.measure.config.ts --reporter=verbose src/fleet-production.test.ts 2>&1 | tee -a ../../c.log || true
            echo "ROUND C$round done $(date -u +%H:%M:%S.%3N)"
          done
          touch "$stop"
          wait
          cat ../../c-bench.log
      - name: D, process-table samples with nothing else running
        working-directory: apps/daemon
        run: |
          stop="$RUNNER_TEMP/stop-bench-d"
          BENCH_INTERVAL_MS=2000 node measure/bench.mjs quiet 0 loop "$stop" > ../../d-bench.log 2>&1 &
          sleep 60
          touch "$stop"
          wait
          cat ../../d-bench.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: measure-logs-3
          path: |
            a.log
            b.log
            c.log
            c-bench.log
            d-bench.log
