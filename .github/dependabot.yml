version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Boise
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 ships no JavaScript compiler API; typescript-eslint and
      # tsup's declaration bundler both refuse it. Our own code typechecks clean
      # under 7.0, so this is a toolchain wait, not a source problem. Lift it
      # when typescript-eslint admits 7.x (typescript-eslint#10940) and tsup
      # bundles declarations without a TypeScript 6 peer.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Expo SDK 57 pins these to the versions its own installer resolves. A
      # bare bump breaks jest-expo's preset (react-native 0.87.1 dropped
      # @react-native/assets-registry, measured 2026-09-14). They move together
      # in an Expo SDK upgrade through `npx expo install --fix`, not one at a
      # time here.
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: jest-expo
      - dependency-name: react-native
      - dependency-name: "@react-native/*"
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-svg
      - dependency-name: react-native-worklets
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Boise
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
