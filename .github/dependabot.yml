version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Boise
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 ships no JavaScript compiler API; typescript-eslint and
      # tsup's declaration bundler both refuse it. Our own code typechecks clean
      # under 7.0, so this is a toolchain wait, not a source problem. Lift it
      # when typescript-eslint admits 7.x (typescript-eslint#10940) and tsup
      # bundles declarations without a TypeScript 6 peer.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Boise
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
