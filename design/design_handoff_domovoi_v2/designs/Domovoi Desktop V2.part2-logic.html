          label: st.sessionState === "paused" ? "Resume this session" : "Pause this session",
          note: "The daemon keeps the thread, plan and worktree.",
          k: "info",
          act: () => this.setState(s => ({ actionsOpen: false, sessionState: s.sessionState === "paused" ? "running" : "paused" }))
        },
        {
          label: "Fork from a checkpoint",
          note: "Branches from a checkpoint, leaving this session intact.",
          k: "primary",
          act: () => this.setState({ actionsOpen: false, sheetOpen: true, sheetTab: "checkpoints" })
        },
        {
          label: "Archive this session",
          note: "Read-only afterwards, worktree kept.",
          k: "muted",
          act: () => this.setState({ actionsOpen: false, sessionState: "archived" })
        },
        {
          label: "Restart the provider thread",
          note: "Same worktree, fresh context with the model.",
          k: "info",
          act: () => this.setState({ actionsOpen: false })
        }
      ].map((a, i) => ({
        label: a.label, note: a.note,
        dot: this.dot(a.k === "muted" ? "var(--muted-foreground)" : "var(--" + a.k + ")", 5),
        act: a.act,
        labelStyle: "font-size: 12px; color: var(--strong);",
        rowStyle: "display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 9px; border-radius: calc(var(--radius) - 3px); cursor: pointer;"
      })),

      stopOpen: st.stopOpen,
      toggleStop: () => this.setState(s => ({ stopOpen: !s.stopOpen, actionsOpen: false, usageOpen: false })),
      stopBtnStyle: "position: relative; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 28px; border-radius: calc(var(--radius) - 3px); cursor: pointer; color: " +
        (st.stopOpen ? "var(--danger-fg)" : "var(--muted-foreground)") + ";" + (st.stopOpen ? " background: var(--danger-bg);" : ""),
      stopOptions: [
        {
          label: "Pause everything",
          note: "Stops at the next turn boundary, nothing is killed.",
          k: "info"
        },
        {
          label: "Emergency stop",
          note: "Kills processes now. Half-written files stay half-written.",
          k: "destructive"
        }
      ].map((o, i) => ({
        label: o.label, note: o.note,
        dot: this.dot("var(--" + o.k + ")", 7) + " margin-top: 4px;",
        act: () => this.setState({ stopOpen: false, sessionState: "paused" }),
        rowStyle: "display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; cursor: pointer;" + (i ? " border-top: 1px solid var(--border);" : ""),
        labelStyle: "font-size: 12.5px; color: var(--" + (o.k === "destructive" ? "danger-fg" : "foreground") + ");"
      })),

      usageOpen: st.usageOpen,
      toggleUsage: () => this.setState(s => ({ usageOpen: !s.usageOpen, actionsOpen: false, stopOpen: false })),
      usageChipStyle: "display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; cursor: pointer; color: var(--muted-foreground);" +
        (st.usageOpen ? " background: var(--accent);" : ""),
      usageChipText: "42.1k · $0.38",
      usageRows: [
        { k: "THIS TURN", v: "8,410 in · 1,206 out", note: "sonnet-4.6 · 3 tool results", pct: 0 },
        { k: "THIS SESSION", v: "42,118 tokens · $0.38", note: "14 tool calls over 4m 18s", pct: 0 },
        { k: "CONTEXT", v: "42.1k of 200k", note: "resnapshot at 90 percent, or restart the provider thread", pct: 21 },
        { k: "PROVIDER WINDOW", v: "68 percent of 5h limit", note: "resets 17:40 · shared across every session on this machine", pct: 68 }
      ].map((u, i) => ({
        k: u.k, v: u.v, note: u.note,
        barWrapStyle: "display: " + (u.pct ? "block" : "none") + "; height: 5px; border-radius: 3px; background: var(--muted); overflow: hidden; margin-top: 7px;",
        barStyle: "display: block; height: 5px; width: " + u.pct + "%; border-radius: 3px; background: var(--primary);",
        rowStyle: "padding: 11px 13px;" + (i ? " border-top: 1px solid var(--border);" : "")
      })),

      planEditQueued: st.planEdit === "queued",
      startPlanEdit: watching ? undefined : () => this.setState({ planEdit: "queued", planOpen: true }),
      planEditStyle: "font-size: 11px; color: var(--muted-foreground);" + (watching ? " opacity: .45; cursor: not-allowed;" : " cursor: pointer;"),
      discardPlanEdit: () => this.setState({ planEdit: "none" }),

      modelLabel: models[st.model % models.length].label,
      modelMenuOpen: st.modelMenuOpen,
      toggleModelMenu: () => this.setState(s => ({ modelMenuOpen: !s.modelMenuOpen, modeMenuOpen: false, attachMenuOpen: false, slashOpen: false })),
      modelChipStyle: "display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; cursor: pointer; border: 1px solid " +
        (st.modelMenuOpen ? "var(--border)" : "transparent") + "; background: " +
        (st.modelMenuOpen ? "var(--accent)" : "transparent") + ";",
      modelChevron: "display: inline-flex; color: var(--faint); transition: transform .15s var(--ease-out, ease); transform: rotate(" +
        (st.modelMenuOpen ? "180deg" : "0deg") + ");",
      modelQueryText: st.modelQuery || "Search models on this machine",
      modelQueryStyle: "font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--" + (st.modelQuery ? "foreground" : "faint") + ");",
      modelClearStyle: "font-size: 10.5px; color: var(--muted-foreground); cursor: pointer;" + (st.modelQuery ? "" : " display: none;"),
      clearModelQuery: () => this.setState({ modelQuery: "" }),
      modelCount: modelMatches.length + " of " + models.length + " · 5 harnesses",
      modelFilters: ["claude", "codex", "kilo", "opencode", "aider"].map(q => ({
        label: q,
        pick: () => this.setState(s => ({ modelQuery: s.modelQuery === q ? "" : q })),
        style: "padding: 2px 8px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; cursor: pointer; border: 1px solid " +
          (st.modelQuery === q ? "var(--primary)" : "var(--border)") + "; color: " +
          (st.modelQuery === q ? "var(--primary)" : "var(--muted-foreground)") + ";"
      })),
      modelNoMatch: modelMatches.length === 0,
      rediscoverModels: () => this.setState({ modelQuery: "" }),
      modelOptions: modelMatches.map(entry => ({
        label: entry.m.label, agent: entry.m.agent, note: entry.m.note,
        dot: this.dot("var(--" + entry.m.k + ")", 7) + " margin-top: 4px;",
        pick: entry.m.k === "faint" ? undefined : () => this.setState({ model: entry.i, modelMenuOpen: false }),
        tickStyle: "display: inline-flex; align-self: center; color: " + (st.model === entry.i ? "var(--primary)" : "transparent") + ";",
        rowStyle: "display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border);" +
          (st.model === entry.i ? " background: var(--accent);" : "") +
          (entry.m.k === "faint" ? " opacity: .5; cursor: default;" : " cursor: pointer;")
      })),
      unusedModelOptions: models.map((m, i) => ({
        label: m.label, agent: m.agent, note: m.note,
        dot: this.dot("var(--" + m.k + ")", 7) + " margin-top: 4px;",
        pick: m.k === "faint" ? undefined : () => this.setState({ model: i, modelMenuOpen: false }),
        tickStyle: "display: inline-flex; align-self: center; color: " + (st.model === i ? "var(--primary)" : "transparent") + ";",
        rowStyle: "display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border);" +
          (st.model === i ? " background: var(--accent);" : "") +
          (m.k === "faint" ? " opacity: .5; cursor: default;" : " cursor: pointer;")
      })),
      modeOptions: modes.map((m, i) => ({
        label: m.label, note: m.note,
        dot: this.dot(m.color, 7) + " margin-top: 4px;",
        pick: () => this.setState(s => ({ perm: i, auto: i === 2 ? s.auto : false })),
        tickStyle: "display: inline-flex; align-self: center; color: " + (modeIdx === i ? "var(--primary)" : "transparent") + ";",
        rowStyle: "display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); cursor: pointer;" +
          (modeIdx === i ? " background: var(--accent);" : "")
      })),
      autoLabel: autoOn ? "Auto, on" : "Auto",
      autoNote: perm.id === "build"
        ? "Runs step after step without stopping between them. Hard gates and policy refusals still stop it."
        : "Only legal with Build, because Plan and Ask stop on every step by definition.",
      autoLabelStyle: "font-size: 12.5px; color: " + (perm.id === "build" ? "var(--foreground)" : "var(--faint)") + ";",
      autoRowStyle: "display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-top: 1px solid var(--border);" +
        (perm.id === "build" ? " cursor: pointer;" : " opacity: .6; cursor: default;"),
      autoTrackStyle: "position: relative; display: block; width: 34px; height: 20px; flex: 0 0 34px; border-radius: 999px; transition: background .14s var(--ease-out, ease); background: " +
        (autoOn ? "var(--success)" : "var(--muted)") + ";",
      autoKnobStyle: "position: absolute; top: 3px; left: " + (autoOn ? "17px" : "3px") +
        "; width: 14px; height: 14px; border-radius: 50%; background: var(--card); transition: left .14s var(--ease-out, ease); display: block;",
      toggleAuto: perm.id === "build" ? () => this.setState(s => ({ auto: !s.auto })) : undefined,

      machines: [
        {
          name: "mac-mini-m4", status: "connected", k: "success", primary: "Open its 2 sessions", screen: "approval",
          facts: [
            { k: "TRANSPORT", v: "loopback" },
            { k: "AGENTS", v: "claude-code · codex" },
            { k: "SESSIONS", v: "2 running · 1 waiting on you" },
            { k: "LAST HEARD", v: "just now" }
          ]
        },
        {
          name: "hetzner-cx42", status: "connected", k: "success", primary: "Open its 2 sessions", screen: "working",
          facts: [
            { k: "TRANSPORT", v: "domovoi cloud · encrypted payloads" },
            { k: "AGENTS", v: "claude-code · codex · aider" },
            { k: "SESSIONS", v: "1 running · 1 failed" },
            { k: "LAST HEARD", v: "2s ago" }
          ]
        },
        {
          name: "wsl-ubuntu-24", status: "unreachable", k: "destructive", primary: "See what stalled", screen: "offline",
          facts: [
            { k: "TRANSPORT", v: "tailnet · route dropped" },
            { k: "AGENTS", v: "claude-code" },
            { k: "SESSIONS", v: "1 stalled mid-run" },
            { k: "LAST HEARD", v: "41s ago" }
          ]
        }
      ].map(m => ({
        name: m.name, status: m.status, facts: m.facts, primary: m.primary,
        dot: this.dot("var(--" + m.k + ")", 7),
        primaryGo: this.go(m.screen),
        cardStyle: "border: 1px solid " + (m.k === "destructive" ? "var(--danger-border)" : "var(--border)") +
          "; border-radius: var(--radius); background: var(--card); overflow: hidden; display: flex; flex-direction: column;" +
          (m.k === "destructive" ? " opacity: .72;" : ""),
        pillStyle: "padding: 2px 8px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: color-mix(in oklab, var(--" +
          m.k + ") 16%, transparent); color: var(--" + m.k + ");",
        primaryStyle: "padding: 6px 12px; border-radius: calc(var(--radius) - 2px); background: var(--accent); font-size: 11.5px; color: var(--foreground); cursor: pointer;"
      })),
      agents: [
        { name: "claude-code", machine: "mac-mini-m4", state: "ready, token in keychain", k: "success", action: "" },
        { name: "codex", machine: "mac-mini-m4", state: "ready, token in keychain", k: "success", action: "" },
        { name: "claude-code", machine: "hetzner-cx42", state: "ready, token in keychain", k: "success", action: "" },
        { name: "aider", machine: "hetzner-cx42", state: "needs auth, no token on that machine", k: "warning", action: "Authenticate there" },
        { name: "claude-code", machine: "wsl-ubuntu-24", state: "unknown, daemon unreachable", k: "faint", action: "" }
      ].map((a, i) => ({
        name: a.name, machine: a.machine, state: a.state, action: a.action,
        dot: this.dot("var(--" + a.k + ")", 6),
        rowStyle: "display: flex; align-items: center; gap: 11px; padding: 10px 15px;" + (i ? " border-top: 1px solid var(--border);" : "") +
          (a.k === "faint" ? " opacity: .6;" : ""),
        actionStyle: a.action
          ? "padding: 5px 10px; border-radius: 999px; border: 1px solid var(--info-border); background: var(--info-bg); color: var(--info-fg); font-size: 11px; cursor: pointer;"
          : "display: none;"
      }))
    };
  }
}

</script>
</body>
</html>
