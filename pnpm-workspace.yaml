packages:
  - apps/*
  - packages/*

# pnpm reads only auth and registry settings from .npmrc, so the peer policy
# lives here. A resolution that leaves a peer outside its declared range fails
# unless a rule below names it.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # electron-vite 5 declares vite up to 7; 6.0.0-beta.1 is the first to admit
    # vite 8. Remove once the desktop moves to electron-vite 6.
    electron-vite>vite: "8"
    # Expo pins react 19.2.3 for the phone, while the react-dom its web tooling
    # resolves (19.2.8) asks for at least its own version. Remove once Expo's
    # react pin reaches the react-dom it installs.
    react-dom>react: "19.2.3"

allowBuilds:
  '@parcel/watcher': true
  electron: true
  # electron-builder pulls this for the Squirrel.Windows target. The Windows
  # target here is NSIS, so its install script never has to run.
  electron-winstaller: false
  esbuild: true
  node-pty: true
  unrs-resolver: true

overrides:
  # Pins every consumer to one esbuild copy. electron-vite 5.0.0 declares ^0.25.11 and
  # tsup 8.5.1 declares ^0.27.0, so neither admits 0.28.x. Remove the override once both
  # declare ranges that include 0.28.
  esbuild: 0.28.2
  # GHSA-2883-xcg3-v3hh, high: js-yaml below 4.3.2 does not bound CPU use for empty
  # merge sources. Every consumer already declares a range admitting 4.3.2; the old
  # version came from lockfile resolution, so this forces the floor. Scoped to 4.x
  # because the advisory also names 3.15.2 as patched, and the 3.x consumer must not
  # be dragged across a major. Remove once the lockfile resolves 4.3.2 on its own.
  js-yaml@4: ^4.3.2

catalog:
  "@vitest/coverage-v8": ^5.0.0
  typescript: ^5.9.2
  vite: ^8.2.2
  vitest: ^5.0.0
  zod: ^4.5.2

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
