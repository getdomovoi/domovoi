packages:
  - apps/*
  - packages/*

# pnpm reads only auth and registry settings from .npmrc, so the peer policy
# lives here. A resolution that leaves a peer outside its declared range fails
# unless a rule below names it.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # electron-vite 5 declares vite up to 7; 6.0.0-beta.1 is the first to admit
    # vite 8. Remove once the desktop moves to electron-vite 6.
    electron-vite>vite: "8"
    # Expo pins react 19.2.3 for the phone, while the react-dom its web tooling
    # resolves (19.2.8) asks for at least its own version. Remove once Expo's
    # react pin reaches the react-dom it installs.
    react-dom>react: "19.2.3"

allowBuilds:
  '@parcel/watcher': true
  electron: true
  # electron-builder pulls this for the Squirrel.Windows target. The Windows
  # target here is NSIS, so its install script never has to run.
  electron-winstaller: false
  esbuild: true
  node-pty: true
  unrs-resolver: true

overrides:
  # Pins every consumer to one esbuild copy. electron-vite 5.0.0 declares ^0.25.11 and
  # tsup 8.5.1 declares ^0.27.0, so neither admits 0.28.x. Remove the override once both
  # declare ranges that include 0.28.
  esbuild: 0.28.2
  # GHSA-2883-xcg3-v3hh, high: js-yaml below 4.3.2 does not bound CPU use for empty
  # merge sources. Every consumer already declares a range admitting 4.3.2; the old
  # version came from lockfile resolution, so this forces the floor. Scoped to 4.x
  # because the advisory also names 3.15.2 as patched, and the 3.x consumer must not
  # be dragged across a major. Remove once the lockfile resolves 4.3.2 on its own.
  js-yaml@4: ^4.3.2
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7, high: brace-expansion recurses without a
  # bound on crafted patterns. Reached through minimatch in eslint, electron-builder and the
  # mobile Expo toolchain. Scoped per major so no consumer crosses a major. Remove once the
  # lockfile resolves the patched versions on its own.
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  # GHSA-pqg4-j6r4-53mv, critical: shell-quote 1.8.4 to 1.10.x lets a line terminator
  # after a comment token inject a command through quote(). Reached through
  # @changesets/cli > launch-editor and the mobile Expo toolchain > react-devtools-core.
  # Remove once the lockfile resolves 1.11.0 or later on its own.
  shell-quote@1: ^1.11.0
  # GHSA-68fv-2mgg-jv7q, high: source-map-js below 1.2.2 lets indexed source-map section
  # offsets block the event loop. Reached through postcss in tsup and vite. Remove once
  # the lockfile resolves 1.2.2 or later on its own.
  source-map-js@1: ^1.2.2
  # GHSA-6qxp-vccf-f47h, high: the MCP TypeScript SDK below 1.31.0 can send OAuth client
  # credentials to an authorization server the MCP server chooses. Reached directly from
  # apps/daemon, through @anthropic-ai/claude-agent-sdk, and through the shadcn CLI in
  # packages/ui. Remove once every consumer resolves 1.31.0 or later on its own.
  '@modelcontextprotocol/sdk@1': ^1.31.0
  # GHSA-587h-7wmj-h5pm, high: launch-editor 2.14.1 and earlier have an fs.existsSync()
  # existence check that can be bypassed on Windows. Reached only through @changesets/cli, whose
  # latest release (3.0.3) still declares ^2.14.1, so no direct dependency raises it. vite 8.3.0
  # to 8.3.2 carry the same advisory; the catalog floor below covers those. Remove once the
  # lockfile resolves 2.14.2 or later on its own.
  launch-editor@2: ^2.14.2
  # GHSA-mrhx-c7xc-m3w5, high: zod below 4.6.6 can exhaust memory while validating oversized
  # constrained collections. The catalog floor below covers the direct consumers; this forces
  # the copy eslint-plugin-react-hooks resolves. Scoped to 4.x so no 3.x consumer crosses a
  # major; auditConfig below explains the one 3.x copy. Remove once the lockfile resolves 4.6.6
  # or later on its own.
  zod@4: ^4.6.6
  # GHSA-27r3-jxmh-p828, high: body-parser 2.x below 2.4.0 lets trailing bytes after a
  # compressed request body cause a denial of service. Reached through express 5 in the MCP
  # TypeScript SDK, which apps/daemon uses directly and through @anthropic-ai/claude-agent-sdk.
  # express 5.3.0 and MCP SDK 1.32.2 still declare ranges that admit 2.3.0, so no direct update
  # raises it. Remove once the lockfile resolves 2.4.0 or later on its own.
  body-parser@2: ^2.4.0
  # GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx and GHSA-qrxm-fqhp-jwvm,
  # high: undici below 6.29.1 and 7.30.1 has denial of service, cache poisoning and TLS
  # certificate validation flaws. Reached through @electron/get and node-gyp in the desktop
  # build tooling and the shadcn CLI in packages/ui. Scoped per major so no consumer crosses a
  # major. Remove once the lockfile resolves the patched versions on its own.
  undici@6: ^6.29.1
  undici@7: ^7.30.1
  # GHSA-3f7j-7jwc-fxfj, high: systeminformation below 5.33.16 allows Windows command injection
  # in services(). Reached only through the shadcn CLI in packages/ui. Remove once the lockfile
  # resolves 5.33.16 or later on its own.
  systeminformation@5: ^5.33.16
  # GHSA-7wch-p9px-956x, GHSA-jc66-7q78-782g, GHSA-8hrf-8g6f-7xwp, GHSA-hqq3-7jhf-c5jx and
  # GHSA-5x38-2vff-x55p, high: node-forge 1.4.0 and earlier. Reached only through Expo CLI in
  # apps/mobile. Remove once the lockfile resolves 1.4.1 or later on its own.
  node-forge@1: ^1.4.1

catalog:
  "@vitest/coverage-v8": ^5.0.0
  typescript: ^5.9.2
  vite: ^8.3.3
  vitest: ^5.0.0
  zod: ^4.6.6

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20

auditConfig:
  ignoreGhsas:
    # GHSA-86w9-cpqp-85rv, high: node-forge accepts extra nested DigestAlgorithm
    # elements in RSA PKCS#1 v1.5 signature checks. Every node-forge release is
    # affected (<= 1.4.0) and none is patched as of 2026-10-01. It reaches only
    # apps/mobile, through Expo CLI's code-signing tools for development builds;
    # the daemon, desktop, web and CLI do not depend on it. Ruling Q309 A,
    # 2026-10-01. Remove once node-forge or Expo ships a fix.
    - GHSA-86w9-cpqp-85rv
    # GHSA-ch52-4w7c-c8xp, high: http-cache-semantics lets a large max-stale read
    # zeroed shared-cache entries. Every release is affected (<= 4.2.0) and none is
    # patched as of 2026-10-02; the advisory names no fixed version and npm has no
    # 4.2.1, so an override has nothing to force. It reaches only apps/desktop, as
    # a devDependency: electron-builder > @electron/get > got > cacheable-request,
    # used while packaging. No shipped client or daemon depends on it. Ruling Q406
    # A, 2026-10-02. Remove once a patched http-cache-semantics is published, and
    # force it in overrides.
    - GHSA-ch52-4w7c-c8xp
    # GHSA-vfj7-8cjw-p6xm, high: braces recursion has no depth guard, so a deeply
    # nested pattern exhausts the stack. Every release is affected (<= 3.0.3) and
    # none is patched as of 2026-10-02; the advisory names no fixed version and npm
    # has no 3.0.4, so an override has nothing to force. It reaches only Node build
    # tooling through micromatch and chokidar: Metro, Expo CLI, Jest and Tailwind in
    # apps/mobile, and the shadcn CLI in packages/ui. Ruling Q406 A, 2026-10-02.
    # Remove once a patched braces is published, and force it in overrides.
    - GHSA-vfj7-8cjw-p6xm
    # GHSA-mrhx-c7xc-m3w5, high: zod can exhaust memory while validating oversized
    # constrained collections. The advisory covers every 3.x release and names only
    # 4.6.6 as patched. The zod@4 override and the catalog floor keep every 4.x copy
    # patched, so this ignore covers only zod 3.25.76, which reaches apps/mobile
    # through @expo/cli 57.0.26. The dev server uses it to validate dev tools plugin
    # manifests and their output; no shipped client or daemon depends on it.
    # @expo/cli 57.0.33 drops zod, but reaching it needs the Expo SDK patch bump to
    # expo ~57.0.32. Ruling Q167 A, 2026-11-06. Remove with that bump.
    - GHSA-mrhx-c7xc-m3w5

# Swift 6.4 (Xcode 27.1) spells C++ types `__ObjC::expo...`, which the published SDK 57 strip
# program misses; the patch backports the expo-modules-jsi 58 program. Remove it with the move to
# Expo SDK 58. apps/mobile/README.md has the details.
patchedDependencies:
  expo-modules-jsi@57.1.0: patches/expo-modules-jsi@57.1.0.patch
# Desktop packaging runs `pnpm --filter @getdomovoi/daemon deploy`, whose filtered install has no
# expo-modules-jsi and would otherwise fail with ERR_PNPM_UNUSED_PATCH. A patch that stops
# applying after an Expo upgrade is caught by apps/mobile/src/expo-modules-jsi-patch.test.ts.
allowUnusedPatches: true
