packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: true
  node-pty: true
  unrs-resolver: true

# Expo's CLI pulls image-size 2.0.2 through its dev tooling. Two high advisories
# name 2.0.3 as patched and npm has published nothing above 2.0.2, so an override
# cannot resolve. The path is CLI tooling and does not ship in the phone bundle.
# Remove both ids the moment 2.0.3 exists.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

overrides:
  # Pins every consumer to one esbuild copy. electron-vite 5.0.0 declares ^0.25.11 and
  # tsup 8.5.1 declares ^0.27.0, so neither admits 0.28.x. Remove the override once both
  # declare ranges that include 0.28.
  esbuild: 0.28.2

catalog:
  "@vitest/coverage-v8": ^4.1.11
  typescript: ^5.9.2
  vite: ^8.2.2
  vitest: ^4.1.11
  zod: ^4.5.2

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
