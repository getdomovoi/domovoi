# Distributable Domovoi Desktop builds.
#
# electron-builder rather than Electron Forge: this app is already built by
# electron-vite, which emits a finished out/ tree and leaves packaging alone,
# and electron-builder consumes that tree directly. Forge would want to own the
# bundler through its own Vite plugin, which does not understand electron-vite's
# layout.
#
# Package commands load electron-builder.cjs, which extends this layout with
# the credential policy and mandatory signature verification. Do not invoke
# this layout alone for a release. See docs/desktop-signing.md.
#
# productName lives in package.json, not here, because Electron reads it at
# runtime for app.getName() and therefore for userData, logs and the single
# instance lock. One source of truth keeps the packaged profile directory from
# drifting away from the development one.
appId: sh.domovoi.desktop
artifactName: domovoi-desktop-${version}-${arch}.${ext}
copyright: Copyright (c) Domovoi contributors

directories:
  buildResources: build
  output: dist

# electron-vite writes out/. electron-builder adds the production dependencies
# itself, and those are only what the main process and the preload load at run
# time. The UI and React are development dependencies: vite inlines them into
# out/renderer, so none of the renderer's packages is copied as node_modules.
# scripts/declared-dependencies.test.mjs and
# scripts/desktop-package-contents.test.mjs check both halves.
#
# The Claude Agent SDK library ships; its per-platform packages, which carry
# the vendor's agent binary, do not. The daemon runs the person's own
# installed claude instead.
files:
  - out/**
  - package.json
  # The digests of the shipped daemon's dist, checked before the app imports it
  # (scripts/daemon-runtime.mjs, src/main/daemon-module.ts). Inside app.asar,
  # not beside the runtime they describe.
  - daemon-runtime-manifests/**
  - "!**/*.map"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"

# The daemon runtime the app ships for the login service (J24): one pinned
# Node program and the daemon with its production dependencies, prepared by
# scripts/prepare-daemon-runtime.mjs for the host platform and architecture
# before packaging. Outside the asar, because the service runs it as plain
# files after the app copies it under the profile.
# The renderer's bundles carry no license comments, so the notices for the
# graph this build contains travel as one file in the resources directory.
# prepackage runs scripts/third-party-notices.mjs, which writes build/notices/
# and fails when Electron's own notice files are missing.
extraResources:
  - from: daemon-runtime/${platform}-${arch}
    to: daemon-runtime
  - from: build/notices/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

# @napi-rs/keyring and node-pty are Node-API modules and load unchanged in
# Electron, so there is nothing to rebuild and no compiler to require.
npmRebuild: false
# The release workflow attaches artifacts. Packaging never uploads.
publish: null

asar: true
# A native module has to exist as a real file on disk before dlopen can take
# it. node-pty and the keyring binding are unpacked whole rather than by
# extension, because node-pty also ships plain executables next to its .node
# files: spawn-helper on macOS, OpenConsole.exe and conpty.dll on Windows.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/node-pty/**"
  - "**/node_modules/@napi-rs/**"

# Deep links. This becomes the Linux desktop-entry MimeType, the macOS
# CFBundleURLTypes entry, and the NSIS protocol registration.
protocols:
  - name: Domovoi
    schemes:
      - domovoi

linux:
  target:
    - AppImage
    - deb
  # The domovoi and domovoid names belong to the CLI and the daemon, which ship
  # as their own Linux packages. Only Linux needs the rename; macOS and Windows
  # keep Domovoi, and setting this at the top level would rename the macOS
  # bundle to domovoi-desktop.app as well.
  executableName: domovoi-desktop
  category: Development
  synopsis: Local-first agent sessions with a daemon that owns the state
  description: >-
    Domovoi runs agent sessions against a daemon on the machine that holds the
    code. The desktop application starts and owns that daemon when no other
    client already has it.
  # Debian requires a maintainer contact and electron-builder refuses to build a
  # deb without one. This address is a Cloudflare Email Routing rule on
  # domovoi.sh that forwards to the maintainer, so it receives mail but cannot
  # send from that address.
  maintainer: Domovoi contributors <maintainers@domovoi.sh>
  # Electron takes its Linux app_id from desktopName in package.json. Syncing
  # the desktop entry to the same name is what lets a running window carry the
  # application icon instead of a generic one.
  syncDesktopName: true

deb:
  # Without this the package is named domovoi, which the CLI package will want.
  packageName: domovoi-desktop

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # macOS does not mask app icons, so the Dock needs the squircle drawn in.
  # Windows and Linux keep build/icon.png, the full-bleed square.
  # Both are generated by scripts/brand-icons.mjs.
  icon: build/icon-mac.png
  # Notarization requires the hardened runtime, and the hardened runtime
  # requires these entitlements before a build is worth submitting.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Inert layout default. The policy enables both signing and notarization
  # together or deliberately chooses an ad-hoc development build.
  notarize: false
  # Linux and Windows builds keep Electron's LICENSE (as LICENSE.electron.txt)
  # and LICENSES.chromium.html beside the executable. electron-builder deletes
  # both from a macOS bundle, so they go into its resources directory instead.
  extraResources:
    - from: build/notices/LICENSE.electron.txt
      to: LICENSE.electron.txt
    - from: build/notices/LICENSES.chromium.html
      to: LICENSES.chromium.html

dmg:
  writeUpdateInfo: false

win:
  target:
    - nsis
  # The policy chooses this signer or Azure, never both. No credentials or
  # passwords are placed in the configuration or the effective-config artifact.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Domovoi
